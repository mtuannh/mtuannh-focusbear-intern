name: Markdown Checks

on:
  pull_request:

jobs:
  markdown-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check Markdown formatting
        run: npx markdownlint-cli2 "**/*.md"

      - name: Check spelling
        run: npx cspell "**/*.md"